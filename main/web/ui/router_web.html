<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>路由器管理</title>
<style>
@UI_style_css@
</style>
</head>
<body>
<header><div><div class="brand"><span class="logo" aria-hidden="true">↗</span><div><p class="eyebrow">ESP32 ROUTER</p><h1>路由器管理</h1></div></div><button id="logout" class="secondary" hidden>退出登录</button></div></header>
<main>
<section id="login-panel" class="card login" aria-labelledby="login-title">
<h2 id="login-title">登录管理页面</h2><p class="muted">连接路由器 Wi-Fi 后，使用管理密码登录。</p>
<form id="login-form"><label for="login-password">管理密码</label><input id="login-password" type="password" autocomplete="current-password" required maxlength="63"><button id="login-submit" type="submit">登录</button><p id="login-error" class="error" role="alert" hidden></p></form>
</section>
<section id="dashboard" hidden aria-label="路由器控制台">
<div class="intro"><h2>网络概况</h2><p class="muted refresh"><span class="dot" aria-hidden="true"></span><span id="refresh-state" role="status">每 5 秒自动更新</span></p></div>
<section id="reconnect" class="notice" role="status" hidden><h3>配置已保存，即将重启</h3><p>重新连接 Wi-Fi：<strong id="new-ssid"></strong></p><p>连接后打开：<a id="new-url"></a></p><p class="hint">请使用新密码连接；管理密码如有修改，下次登录时生效。若与有线网络网段冲突，请以设备日志中的 AP 网关地址为准。</p></section>
@UI_network_html@
@UI_storage_html@
@UI_logs_html@
@UI_settings_html@
</section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
@UI_common_js@
@UI_logs_js@
@UI_network_js@
@UI_storage_js@
@UI_settings_js@
@UI_app_js@
</script>
</body>
</html>
