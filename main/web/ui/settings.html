<section id="settings" class="card" aria-labelledby="settings-title"><h2 id="settings-title">网络设置</h2><form id="config-form">
<fieldset><legend>Wi-Fi</legend><div class="fields"><div><label for="ssid">网络名称（SSID）</label><input id="ssid" name="ssid" required maxlength="32" autocomplete="off"><p class="hint">最多 32 个 UTF-8 字节。</p></div><div><label for="password">新的 Wi-Fi 密码</label><input id="password" name="password" type="password" maxlength="63" autocomplete="new-password" placeholder="留空保留当前密码"><p class="hint">8–63 字节；修改后需要重新连接。</p></div></div></fieldset>
<fieldset><legend>AP 内网</legend><div class="fields"><div><label for="gateway">网关 IP 地址</label><input id="gateway" name="gateway" required inputmode="decimal" maxlength="15" placeholder="192.168.4.1" aria-describedby="gateway-hint"><p id="gateway-hint" class="hint">设置内网网段，例如 192.168.4.1。</p></div><div><label for="netmask">子网掩码</label><input id="netmask" name="netmask" required inputmode="decimal" maxlength="15" placeholder="255.255.255.0"></div><div><label for="dns">DNS 服务器</label><input id="dns" name="dns" inputmode="decimal" maxlength="15" placeholder="自动使用有线网络 DNS"><p class="hint">留空表示自动获取。</p></div></div></fieldset>
<fieldset><legend>管理安全</legend><div class="fields"><div><label for="admin_password">新的管理密码</label><input id="admin_password" name="admin_password" type="password" maxlength="63" autocomplete="new-password" placeholder="留空保留当前密码"><p class="hint">8–63 字节，用于登录此页面。</p></div></div></fieldset>
<div class="actions"><button id="save" type="submit">保存并重启</button><p class="muted">配置将持久保存。重启会暂时断开网络。</p></div><p id="config-error" class="error" role="alert" hidden></p>
</form></section>
