<details id="logs-panel" class="card devices"><summary>系统日志</summary>
<p class="hint">展开后每 5 秒更新。保留最近 24 小时、最多 2048 条，容量满时覆盖最旧记录；重启后清空。每条最多约 1 KiB，超长内容标记为截断。</p>
<pre id="logs-content" class="log-output" tabindex="0" aria-label="应用日志"></pre><p id="logs-error" class="error" role="alert" hidden></p>
</details>
